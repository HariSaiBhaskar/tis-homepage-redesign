<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Tulas International School — A CBSE school nurturing curious minds from Pre-Primary to Senior Secondary. Admissions open for 2026–27."
    />
    <title>Tulas International School | Nurturing Tomorrow's Leaders</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('tis-theme');
          if (
            stored === 'dark' ||
            (!stored &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          ) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <div
        style="
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #f5f7fc;
          font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        "
      >
        <div style="text-align: center">
          <svg
            width="72"
            height="72"
            viewBox="0 0 64 64"
            style="margin: 0 auto 18px"
            aria-hidden="true"
          >
            <rect width="64" height="64" rx="14" fill="#2f4bd7" />
            <path d="M32 14 8 25l24 11 18-8.25V38h4V25L32 14z" fill="#fff" />
            <path
              d="M20 32.5V43c0 4.4 5.4 8 12 8s12-3.6 12-8v-10.5l-12 5.5-12 5.5z"
              fill="#f2b544"
            />
          </svg>
          <div
            style="
              font-family: Fraunces, Georgia, serif;
              font-size: 26px;
              font-weight: 700;
              color: #0e1830;
            "
          >
            Tulas
          </div>
          <div
            style="
              font-size: 11px;
              font-weight: 700;
              letter-spacing: 0.28em;
              color: #2f4bd7;
              margin-top: 4px;
            "
          >
            INTERNATIONAL SCHOOL
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
